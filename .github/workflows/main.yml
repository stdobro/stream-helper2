name: Twitch_Proxy_Farm_mik04ka_Debug
on:
  workflow_dispatch:

jobs:
  viewer_farm:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 5 параллельных ботов
        id: [1, 2, 3, 4, 5]
    
    env:
      STREAM_URL: "https://www.twitch.tv/mik04ka"

    steps:
      - name: Install Streamlink and cURL
        run: |
          python3 -m pip install --upgrade streamlink

      - name: Fetch Free Proxies and Run with Status
        run: |
          # Скачиваем свежий список бесплатных прокси
          curl -sS "https://api.proxyscrape.com/v2/?request=displayproxies&protocol=all&timeout=10000&country=all&ssl=all&anonymity=all" > proxies.txt
          
          # Перемешиваем список для уникальности адресов у каждого бота
          shuf proxies.txt -o proxies_shuffled.txt
          
          echo "=== Бот №${{ matrix.id }} успешно инициализирован и начинает работу ==="
          
          while read -r proxy; do
            # Убираем лишние символы возврата каретки, если они есть
            proxy=$(echo "$proxy" | tr -d '\r')
            
            echo "[Бот №${{ matrix.id }}] Проверяем прокси: $proxy"
            
            # Проверяем, отвечает ли прокси вообще, чтобы не тратить время на мертвые
            if ! curl --proxytunnel --proxy "http://$proxy" -s --connect-timeout 4 "https://www.twitch.tv" > /dev/null; then
               echo "[Бот №${{ matrix.id }}] ❌ Прокси не отвечает (Timeout/Dead). Ищем следующий..."
               continue
            fi
            
            echo "[Бот №${{ matrix.id }}] 🌐 Прокси живой! Пробуем подключиться к стриму..."
            echo "[Бот №${{ matrix.id }}] 🟢 СТАТУС: РАБОТАЕТ. Имитирую просмотр через $proxy"
            
            # Запуск Streamlink. Если прокси рабочий, этот шаг будет висеть активным
            if streamlink --http-proxy "http://$proxy" --loglevel info --retry-streams 5 "${{ env.STREAM_URL }}" "audio_only,worst" --stdout > /dev/null 2>&1; then
              echo "[Бот №${{ matrix.id }}] ⚠️ Внимание: Стрим завершился или прокси оборвал соединение."
            else
              echo "[Бот №${{ matrix.id }}] 🔴 СТАТУС: ОШИБКА. Twitch сбросил этот прокси или поток упал."
            fi
            
            echo "[Бот №${{ matrix.id }}] Переключаемся на следующий прокси из списка..."
            sleep 2
            
          done < proxies_shuffled.txt
